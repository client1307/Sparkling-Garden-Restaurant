# Render Blueprint — deploys the Express + Socket.IO API.
# Frontend goes to Vercel (see README).
services:
  - type: web
    name: sparkling-api
    runtime: node
    rootDir: server
    plan: free            # use "starter" for always-on (free instances sleep after ~15 min idle)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false       # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false       # your Vercel URL, e.g. https://the-sparkling.vercel.app
      - key: GEMINI_API_KEY
        sync: false       # optional (AI concierge)
